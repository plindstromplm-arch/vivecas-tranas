<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vivecas Tranås</title><style> *{box-sizing:border-box}body{margin:0;background:#eaf2f8;color:#25465e;font:18px system-ui}main{max-width:1100px;margin:auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}section,header{background:white;border-radius:20px;padding:22px}header,.wide{grid-column:1/-1}h1,h2,p{margin:0 0 12px}h2{font-size:21px}#clock{font-size:clamp(48px,9vw,90px);font-weight:700;font-variant-numeric:tabular-nums}#temp{font-size:48px;font-weight:bold}.scene{border-radius:16px;overflow:hidden}.scene svg{width:100%;height:240px;display:block}.days{display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px}.day{text-align:center}button{font:inherit;background:#a52e36;color:white;border:0;border-radius:12px;padding:14px}body.night{background:#142331;color:#e3edf6}body.night section,body.night header{background:#233a4c}a{color:inherit}@media(max-width:650px){main{grid-template-columns:1fr;padding:10px;gap:10px}section,header{padding:16px}.wide{grid-column:auto}}header{padding:18px 24px}h1{font-size:25px;letter-spacing:-.6px}#clock{display:flex;align-items:center;gap:5px;font-size:clamp(42px,8vw,76px)}#clock span{background:#25465e;color:white;border-radius:10px;padding:0 9px;box-shadow:0 3px 0 #173348;background-image:linear-gradient(transparent 49%,#ffffff25 50%,transparent 51%)}#clock small{font-size:.42em;align-self:end;margin-bottom:9px}.scene{background:#b9def4}.scene svg{height:auto;max-height:280px}#temp{font-size:42px}.weathergrid{display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:12px}.day{flex:1;background:#edf3f8;border-radius:12px;padding:8px 4px;font-size:14px;white-space:pre-line}body.night .day{background:#30495c}.solargrid{display:flex;gap:18px;justify-content:space-around;margin-bottom:22px}.solargrid b{display:block;font-size:24px}.solargrid svg{width:42px;height:30px;display:block;margin:auto}.links{display:grid;gap:10px}.links a{padding:12px;background:#edf3f8;border-radius:10px;text-decoration:none}body.night .links a{background:#30495c}#christmas{background:linear-gradient(135deg,#234d42,#386957);color:white}#door{font-size:24px;border:2px solid #e9c987;box-shadow:0 4px 12px #0003}#adventlights{font-size:25px;letter-spacing:8px}#greeting{padding:15px;background:#ffffff18;border-radius:12px}#warning{background:#fff1c7;color:#694a12;padding:9px;border-radius:10px;font-size:14px} @media(max-width:650px){h1{font-size:20px}header{padding:14px}#date{font-size:14px;margin:8px 0 0}.weathergrid{grid-template-columns:1fr 1fr;gap:10px}.scene svg{max-height:180px}#conditions{font-size:14px}#updated{font-size:11px}h2{font-size:18px}.day{font-size:12px}section{padding:14px}}header{text-align:center}#clock{justify-content:center}.day .wi{display:block;font-size:27px;margin:4px 0}.day b{display:block;font-size:17px}.day small{display:block}#daylength{text-align:center;font-size:14px;margin-bottom:15px}.solargrid{text-align:center}#warning{margin-top:10px}#adventlights{letter-spacing:4px}</style><main><header><h1>Vivecas Tranås</h1><div id="clock"></div><p id="date"></p></header><section><h2>Vädret i Tranås</h2><div class="weathergrid"><div class="scene"><svg viewBox="0 0 320 220" role="img" aria-label="Väderpojke"><defs><linearGradient id="shade" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".35"/><stop offset="1" stop-color="#000000" stop-opacity=".18"/></linearGradient><radialGradient id="skin"><stop stop-color="#ffe0bd"/><stop offset="1" stop-color="#d9a17e"/></radialGradient></defs><rect id="sky" width="320" height="220" fill="#b9def4"/><circle id="sun" cx="260" cy="42" r="23" fill="#ffdc76"/><g id="clouds" fill="#e4e9ef" opacity=".8"><ellipse cx="65" cy="35" rx="37" ry="12"/><ellipse cx="53" cy="26" rx="19" ry="15"/><ellipse cx="260" cy="72" rx="39" ry="12"/><ellipse cx="245" cy="63" rx="20" ry="15"/></g><path id="ground" d="M0 155 Q80 110 160 155 T320 145 V220 H0" fill="#91b5a2"/><g fill="#f6e9d9"><rect x="15" y="110" width="65" height="55"/><rect x="240" y="115" width="60" height="55"/></g><g fill="#a45149"><path d="M8 110 L48 78 87 110Z"/><path d="M232 115 L270 83 307 115Z"/></g><g id="windows" fill="#69889a" stroke="#fff4df" stroke-width="2"><rect x="24" y="120" width="16" height="23"/><rect x="52" y="120" width="16" height="23"/><rect x="249" y="125" width="16" height="23"/><rect x="276" y="125" width="16" height="23"/></g><path d="M0 220 L125 160 H195 L320 220" fill="#c3c6c6"/><g id="lamps" stroke="#45596a" stroke-width="3"><path d="M94 172V91h12 M226 172V91h-12" fill="none"/><rect x="101" y="88" width="10" height="15" rx="3" fill="#ffe5a1"/><rect x="209" y="88" width="10" height="15" rx="3" fill="#ffe5a1"/></g><ellipse cx="160" cy="205" rx="43" ry="8" fill="#000" opacity=".15"/><path id="legs" d="M145 155 L142 196 M175 155 L178 196" stroke="#334e65" stroke-width="16" stroke-linecap="round"/><path d="M132 200h19 M171 200h19" stroke="#273645" stroke-width="12" stroke-linecap="round"/><path id="coat" d="M140 88 Q160 80 180 88 L187 153 Q160 165 133 153Z" fill="#497ea5"/><path d="M140 88 Q160 80 180 88 L187 153 Q160 165 133 153Z" fill="url(#shade)"/><path d="M160 101 V155 M140 135 l12 -5 M180 135 l-12 -5" stroke="#29485d" opacity=".5" fill="none"/><path id="arms" d="M139 98 L119 140 M181 98 L201 140" stroke="#497ea5" stroke-width="15" stroke-linecap="round"/><circle cx="160" cy="62" r="25" fill="url(#skin)"/><path d="M136 57 Q130 25 160 29 Q187 28 185 57 Q160 39 136 57" fill="#805739"/><ellipse cx="144" cy="70" rx="5" ry="3" fill="#e9a18d"/><ellipse cx="176" cy="70" rx="5" ry="3" fill="#e9a18d"/><ellipse cx="151" cy="62" rx="4" ry="5" fill="white"/><ellipse cx="169" cy="62" rx="4" ry="5" fill="white"/><circle cx="152" cy="62" r="2.7" fill="#38566c"/><circle cx="168" cy="62" r="2.7" fill="#38566c"/><path d="M148 54q4 -3 8 0 M165 54q4 -3 8 0" stroke="#805739" fill="none" stroke-width="2"/><path d="M153 73 Q160 79 167 73" fill="none" stroke="#9e6354" stroke-width="2"/><g id="hat"><path d="M134 48 Q132 20 160 20 Q188 20 186 48Z" fill="#b64949"/><circle cx="160" cy="17" r="7" fill="#b64949"/></g><path id="scarf" d="M138 88 Q160 98 181 88 L181 99 169 99 170 126 160 126 157 99 138 98Z" fill="#b64949"/><g id="umbrella" visibility="hidden"><path d="M199 139 V48" stroke="#34495e" stroke-width="4"/><path d="M145 48 Q199 -8 253 48Z" fill="#efc34c"/></g><g id="precip"></g></svg></div><div><div id="temp">–°</div><p id="conditions">Hämtar väder…</p><small id="updated"></small></div></div><p id="warning" hidden></p></section><section><h2>Solens tider</h2><p id="solar">Hämtar solens tider…</p><h2>Kommande fem dagar</h2><div class="days" id="forecast"></div></section><section id="christmas" hidden><h2>Vivecas julkalender 🎄</h2><p id="adventlights"></p><p id="advent"></p><button id="door">Öppna dagens lucka</button><p id="greeting" hidden></p></section><section class="wide"><h2>Lokalt i Tranås</h2><div class="links"><a href="https://www.tranas.se/">Tranås kommun · information och evenemang ↗</a><a href="https://www.tranastidning.se/">Tranås Tidning · lokala nyheter ↗</a><a href="https://sverigesradio.se/jonkoping">P4 Jönköping · nyheter ↗</a><a href="https://www.smhi.se/vader/varningar-och-meddelanden">SMHI · officiella vädervarningar ↗</a></div></section></main><script>
const el=id=>document.getElementById(id),fmt=(d,o)=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Stockholm',...o}).format(d);let today=0;const greetings=['🎄 Advent betyder ankomst.','🕯️ Tänd ett ljus i vintermörkret.','⭐ Julstjärnan kommer ursprungligen från Mexiko.','🎶 Dagens julsång: Stilla natt.','🍪 Dagens juldoft: kanel.','❄️ Snökristaller har sexfaldig symmetri.','🍊 Apelsin och nejlikor hör julen till.','🎁 Julgåta: Vad blir blötare ju mer det torkar? En handduk!','☕ Dags för en kopp julkaffe.','🌲 Granen är en klassisk jultradition.','🔔 Dagens julsång: Bjällerklang.','🕯️ Imorgon är det Lucia.','👑 Glad Lucia!','🍬 Dagens julgodis: knäck.','⭐ Dagens julmotiv: en stjärnklar vinterhimmel.','🎶 Dagens julsång: Nu tändas tusen juleljus.','🧣 En vinterpromenad i varm halsduk.','🍎 Dagens juldoft: äpple och kanel.','⛄ Julgåta: Vad har morotsnäsa? En snögubbe!','🎄 Snart är det jul.','🌙 Vintersolståndet infaller omkring 21 december.','🎶 Dagens julsång: Jul, jul, strålande jul.','🎁 Dan före dopparedan!','🎄 God jul!'];function tick(){const n=new Date(),p=Object.fromEntries(new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Stockholm',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',hourCycle:'h23'}).formatToParts(n).map(x=>[x.type,x.value]));const time=fmt(n,{hour:'2-digit',minute:'2-digit',second:'2-digit'}).split(':');el('clock').innerHTML='<span>'+time[0]+'</span>:<span>'+time[1]+'</span><small>'+time[2]+'</small>';const d=new Date(Date.UTC(+p.year,+p.month-1,+p.day));d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));const week=Math.ceil(((d-new Date(Date.UTC(d.getUTCFullYear(),0,1)))/86400000+1)/7);el('date').textContent=fmt(n,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · Vecka '+week;document.body.classList.toggle('night',+p.hour>=22||+p.hour<6);if(today!==+p.day){today=+p.day;el('greeting').hidden=true}const first=new Date(Date.UTC(+p.year,11,24));first.setUTCDate(24-first.getUTCDay()-21);const elapsed=(Date.UTC(+p.year,+p.month-1,+p.day)-first)/86400000;el('adventlights').textContent=Array.from({length:4},(_,i)=>elapsed>=i*7?'🕯️':'▫️').join('');el('christmas').hidden=!(elapsed>=-7&&(+p.month===11||+p.month===12&&today<=24));el('door').hidden=+p.month!==12;el('advent').textContent=elapsed<0?'Första advent om '+(-elapsed)+' dagar':+p.month===11?'Glad advent! Julkalendern öppnar 1 december.':'Dagens lucka: '+today;el('door').textContent='Öppna lucka '+today;}tick();setInterval(tick,1000);el('door').onclick=()=>{el('greeting').textContent=greetings[today-1]||'';el('greeting').hidden=!el('greeting').hidden};function weather(c){return c===0?['☀️','Klart']:c<=3?['☁️','Molnigt']:c<=48?['🌫️','Dimma']:c>=71&&c<=77||c===85||c===86?['❄️','Snö']:c>=95?['⛈️','Åska']:['🌧️','Regn'];}async function load(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=58.037&longitude=14.978&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=Europe%2FStockholm&forecast_days=6');if(!r.ok)throw Error();const j=await r.json(),c=j.current,d=j.daily,t=c.temperature_2m,w=weather(c.weather_code);el('temp').textContent=Math.round(t)+'°';el('conditions').textContent=w.join(' ')+' · Känns som '+Math.round(c.apparent_temperature)+'° · Vind '+Math.round(c.wind_speed_10m/3.6)+' m/s';el('updated').textContent='Open-Meteo · '+c.time.slice(11);el('solar').innerHTML='<div class="solargrid">'+[d.sunrise[0],d.sunset[0]].map((v,i)=>'<div><svg viewBox="0 0 48 32" fill="none" stroke="#d69a36" stroke-width="2.5"><path d="M4 26H44 M12 26a12 12 0 0 1 24 0 M24 3v6 M8 9l5 5 M40 9l-5 5"/><path d="'+(i?'M20 7l4 5 4-5':'M20 7l4-5 4 5')+'"/></svg>'+ (i?'Nedgång':'Uppgång')+'<b>'+v.slice(11)+'</b></div>').join('')+'</div>';const mins=v=>+v.slice(11,13)*60 + +v.slice(14,16);const daylight=mins(d.sunset[0])-mins(d.sunrise[0]);el('solar').insertAdjacentHTML('beforeend','<div id="daylength">Dagens längd: '+Math.floor(daylight/60)+' tim '+daylight%60+' min</div>');el('forecast').replaceChildren(...d.time.slice(1).map((v,i)=>{const a=document.createElement('div');a.className='day';a.innerHTML=fmt(new Date(v+'T12:00:00'),{weekday:'short'})+'<span class="wi">'+weather(d.weather_code[i+1])[0]+'</span><b>'+Math.round(d.temperature_2m_max[i+1])+'°</b><small>Natt '+Math.round(d.temperature_2m_min[i+1])+'°</small>';return a}));const rain=w[0]==='🌧️'||w[0]==='⛈️',snow=w[0]==='❄️';el('warning').hidden=!(t<=1||c.wind_speed_10m>=50);el('warning').textContent=t<=1?'⚠ Risk för halka vid fuktigt underlag (temperaturbaserat).':'Blåsigt väder enligt prognosen.';el('windows').setAttribute('fill',c.is_day?'#69889a':'#ffda8a');el('lamps').style.opacity=c.is_day?'.65':'1';el('clouds').style.display=c.weather_code===0?'none':'';el('hat').style.display=t<8?'':'none';el('scarf').style.display=t<5?'':'none';el('umbrella').setAttribute('visibility',rain?'visible':'hidden');const color=rain?'#e6b63d':t>20?'#f4f0df':t>12?'#75a58a':'#497ea5';el('coat').setAttribute('fill',color);el('arms').setAttribute('stroke',color);el('arms').setAttribute('stroke-width',t>20&&!rain?'9':'15');el('legs').setAttribute('stroke',t>22&&!rain?'#efc4a2':'#334e65');el('sky').setAttribute('fill',!c.is_day?'#304b70':rain||snow?'#aab9c7':'#b9def4');el('ground').setAttribute('fill',snow?'#e8f0f6':'#91b5a2');el('sun').style.display=c.is_day&&c.weather_code<=2?'':'none';el('precip').innerHTML=rain||snow?Array.from({length:35},(_,i)=>{const x=(i*73)%320,y=(i*47)%200;return snow?'<circle cx="'+x+'" cy="'+y+'" r="2.5" fill="white"/>':'<path d="M'+x+' '+y+' l-4 10" stroke="#668cae" stroke-width="2"/>'}).join(''):'';}catch(e){el('conditions').textContent='Vädret kunde inte hämtas. Försöker igen senare.';}}load();setInterval(load,600000);
</script></html>
